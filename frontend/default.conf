server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store" always;

    location = /health {
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
