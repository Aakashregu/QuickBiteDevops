---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, netcat-openbsd]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Create APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Install official Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    timeout: 60

- name: Configure Docker repository for Ubuntu 24.04 x86_64
  ansible.builtin.apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable
    filename: docker
    state: present
    update_cache: false

- name: Install Docker Engine and modern Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    lock_timeout: 300

- name: Start Docker now and automatically after reboot
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Let ubuntu use Docker for this trusted lab
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Verify Docker installation
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Verify Compose installation
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false

- name: Show installed versions
  ansible.builtin.debug:
    msg:
      - '{{ docker_version.stdout }}'
      - '{{ compose_version.stdout }}'
